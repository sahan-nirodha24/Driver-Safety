<!DOCTYPE html>
<html>
<head>
    <title>Directions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <style>
        body { padding: 0; margin: 0; background: #111a22; }
        html, body, #map { height: 100%; width: 100%; }
        .leaflet-container { background: #111a22; }
        /* Hide the routing container for a cleaner map view */
        .leaflet-routing-container { display: none; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        console.log("Directions script starting...");
        var map = L.map('map').setView([6.9271, 79.8612], 13);
        var routingControl;
        var startMarker, endMarker;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        function drawRoute(startLat, startLng, endLat, endLng) {
            console.log("drawRoute called: Start[" + startLat + "," + startLng + "] End[" + endLat + "," + endLng + "]");

            // Clear existing markers if any
            if (startMarker) map.removeLayer(startMarker);
            if (endMarker) map.removeLayer(endMarker);
            if (routingControl) map.removeControl(routingControl);

            // Add simple markers as fallback immediately
            startMarker = L.marker([startLat, startLng]).bindPopup("Start").addTo(map);
            endMarker = L.marker([endLat, endLng]).bindPopup("Destination").addTo(map);

            // Fit map to markers immediately
            var group = L.featureGroup([startMarker, endMarker]);
            map.fitBounds(group.getBounds().pad(0.2));

            try {
                routingControl = L.Routing.control({
                    waypoints: [
                        L.latLng(startLat, startLng),
                        L.latLng(endLat, endLng)
                    ],
                    lineOptions: {
                        styles: [{ color: '#2196F3', opacity: 0.8, weight: 6 }]
                    },
                    addWaypoints: false,
                    draggableWaypoints: false,
                    fitSelectedRoutes: true,
                    showAlternatives: false,
                    createMarker: function() { return null; } // Using our own markers
                }).on('routingerror', function(e) {
                    console.error("Routing error: " + e.error.message);
                }).on('routesfound', function(e) {
                    console.log("Route found! Distance: " + e.routes[0].summary.totalDistance + "m");
                }).addTo(map);
            } catch (err) {
                console.error("Error initializing routing: " + err.message);
            }
        }
    </script>
</body>
</html>
