<!DOCTYPE html>
<html lang="en">
<head>
    <title>Leaflet Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { padding: 0; margin: 0; background: #111a22; }
        html, body, #map { height: 100%; width: 100%; }
        .leaflet-container { background: #111a22; }
        .custom-popup .leaflet-popup-content-wrapper {
            background: #192633;
            color: #ffffff;
            border-radius: 8px;
        }
        .custom-popup .leaflet-popup-tip {
            background: #192633;
        }
        .directions-link {
            color: #2196F3;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }
        /* Color filters for markers */
        .marker-orange { filter: hue-rotate(200deg) brightness(1.2); }
        .marker-red { filter: hue-rotate(320deg) brightness(1.2); }
        .marker-green { filter: hue-rotate(90deg) brightness(1.2); }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        console.log("Map script starting...");

        // Fix Leaflet marker icons not appearing in WebView
        delete L.Icon.Default.prototype._getIconUrl;
        L.Icon.Default.mergeOptions({
            iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
            iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        });

        var map = L.map('map').setView([6.9271, 79.8612], 13);

        var mainMarker;
        var searchCircle;
        var nearbyGroup = L.layerGroup().addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).on('tileload', function() {
            console.log("Tile loaded");
        }).addTo(map);

        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            console.log("Map clicked at: " + lat + ", " + lng);
            setMainMarker(lat, lng);
            if (window.Android) {
                console.log("Sending location to Android: " + lat + ", " + lng);
                window.Android.onLocationSelected(lat, lng);
            } else {
                console.warn("window.Android not found");
            }
        });

        function setMainMarker(lat, lng) {
            console.log("setMainMarker called with: " + lat + ", " + lng);
            if (mainMarker) {
                console.log("Removing existing mainMarker");
                map.removeLayer(mainMarker);
            }
            if (searchCircle) {
                console.log("Removing existing searchCircle");
                map.removeLayer(searchCircle);
            }

            mainMarker = L.marker([lat, lng]).addTo(map);
            searchCircle = L.circle([lat, lng], {
                color: '#2196F3',
                fillColor: '#2196F3',
                fillOpacity: 0.15,
                radius: 5000
            }).addTo(map);
            console.log("Main marker and 5km circle added");

            map.fitBounds(searchCircle.getBounds());
        }

        function setCenter(lat, lng) {
            console.log("setCenter called: " + lat + ", " + lng);
            setMainMarker(lat, lng);
        }

        function clearMap() {
            console.log("clearMap called");
            if (mainMarker) {
                map.removeLayer(mainMarker);
                mainMarker = null;
            }
            if (searchCircle) {
                map.removeLayer(searchCircle);
                searchCircle = null;
            }
            nearbyGroup.clearLayers();
            // Reset to default center
            map.setView([6.9271, 79.8612], 13);
        }

        function addNearbyMarkersBase64(base64Data, markerClass) {
            try {
                console.log("addNearbyMarkersBase64 called. markerClass: " + markerClass);
                if (!base64Data) {
                    console.error("No base64Data received!");
                    return;
                }

                console.log("Decoding Base64 data...");
                var binStr = atob(base64Data);
                var bytes = new Uint8Array(binStr.length);
                for (var i = 0; i < binStr.length; i++) {
                    bytes[i] = binStr.charCodeAt(i);
                }
                var jsonStr = new TextDecoder().decode(bytes);
                var places = JSON.parse(jsonStr);

                console.log("Successfully parsed JSON. Count: " + places.length);

                console.log("Clearing nearbyGroup layers");
                nearbyGroup.clearLayers();

                if (places.length === 0) {
                    console.log("No places to display.");
                    return;
                }

                places.forEach(function(place, index) {
                    try {
                        console.log("Adding marker " + (index+1) + ": " + place.name + " at [" + place.lat + ", " + place.lng + "]");

                        var marker = L.marker([place.lat, place.lng], {
                            title: place.name
                        });

                        marker.on('add', function() {
                            if (this._icon) {
                                console.log("Applying class " + markerClass + " to marker icon for " + place.name);
                                this._icon.classList.add(markerClass);
                            } else {
                                console.warn("Marker icon not found for " + place.name + " on 'add' event");
                            }
                        });

                        var popupContent = '<div class="custom-popup">' +
                            '<b>' + (place.name || "Unnamed Place") + '</b><br>' +
                            '<span>' + (place.address || "") + '</span>' +
                            '<a class="directions-link" onclick="navigateTo(' + place.lat + ',' + place.lng + ',\'' + (place.name || "").replace(/'/g, "\\'") + '\')">Get Directions</a>' +
                            '</div>';

                        marker.bindPopup(popupContent).addTo(nearbyGroup);
                    } catch (err) {
                        console.error("Error creating marker for " + place.name + ": " + err);
                    }
                });

                console.log("All markers added to group. Computing bounds...");
                var layersForBounds = nearbyGroup.getLayers();
                if (mainMarker) {
                    console.log("Including mainMarker in bounds computation");
                    layersForBounds.push(mainMarker);
                }

                if (layersForBounds.length > 0) {
                    var group = L.featureGroup(layersForBounds);
                    var bounds = group.getBounds();
                    console.log("Fitting map to bounds: " + JSON.stringify(bounds));
                    map.fitBounds(bounds.pad(0.1));
                }
            } catch (e) {
                console.error("FATAL in addNearbyMarkersBase64: " + e.stack);
            }
        }

        function navigateTo(lat, lng, name) {
            if (window.Android) {
                window.Android.navigateTo(lat, lng, name);
            }
        }
    </script>
</body>
</html>
