<!DOCTYPE html>
<html lang="en">
<head>
    <title>Modern Leaflet Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { padding: 0; margin: 0; background: #111a22; overflow: hidden; }
        html, body, #map { height: 100%; width: 100%; }

        .leaflet-container { background: #111a22; }

        /* Glassmorphism Popup */
        .custom-popup .leaflet-popup-content-wrapper {
            background: rgba(25, 38, 51, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px;
        }
        .custom-popup .leaflet-popup-tip {
            background: rgba(25, 38, 51, 0.85);
        }

        .popup-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; color: #fff; }
        .popup-addr { font-size: 12px; color: #92adc9; line-height: 1.3; }

        .directions-link {
            color: #1380ec;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
            font-size: 13px;
            padding: 6px 12px;
            background: rgba(19, 128, 236, 0.1);
            border-radius: 6px;
            transition: 0.3s;
        }

        /* Animated Pulse Marker */
        .pulse-marker {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            position: relative;
        }
        .pulse-marker::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(3.5); opacity: 0; }
        }

        .marker-orange { background: #ff9800; box-shadow: 0 0 10px #ff9800; }
        .marker-red { background: #f44336; box-shadow: 0 0 10px #f44336; }
        .marker-green { background: #4caf50; box-shadow: 0 0 10px #4caf50; }
        .marker-main { background: #1380ec; box-shadow: 0 0 15px #1380ec; width: 18px; height: 18px; }

    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Theme layers
        var osmTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        var darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        });

        var map = L.map('map', { zoomControl: false, layers: [osmTiles] }).setView([6.9271, 79.8612], 13);
        var currentTheme = 'light';

        function updateTheme(isDark) {
            console.log("Updating theme to: " + (isDark ? "Dark" : "Light"));
            if (isDark && currentTheme !== 'dark') {
                map.removeLayer(osmTiles);
                map.addLayer(darkTiles);
                currentTheme = 'dark';
            } else if (!isDark && currentTheme !== 'light') {
                map.removeLayer(darkTiles);
                map.addLayer(osmTiles);
                currentTheme = 'light';
            }
        }

        var mainMarker, searchCircle;
        var nearbyGroup = L.layerGroup().addTo(map);

        map.on('click', function(e) {
            setMainMarker(e.latlng.lat, e.latlng.lng);
            if (window.Android) window.Android.onLocationSelected(e.latlng.lat, e.latlng.lng);
        });

        function setMainMarker(lat, lng) {
            if (mainMarker) map.removeLayer(mainMarker);
            if (searchCircle) map.removeLayer(searchCircle);

            var icon = L.divIcon({ className: 'pulse-marker marker-main', iconSize: [18, 18], iconAnchor: [9, 9] });
            mainMarker = L.marker([lat, lng], { icon: icon }).addTo(map);

            searchCircle = L.circle([lat, lng], {
                color: '#1380ec', fillColor: '#1380ec', fillOpacity: 0.08, radius: 5000, weight: 1.5
            }).addTo(map);

            map.flyTo([lat, lng], 13, { animate: true, duration: 1.5 });
        }

        function setCenter(lat, lng) { setMainMarker(lat, lng); }

        function clearMap() {
            if (mainMarker) { map.removeLayer(mainMarker); mainMarker = null; }
            if (searchCircle) { map.removeLayer(searchCircle); searchCircle = null; }
            nearbyGroup.clearLayers();
            map.flyTo([6.9271, 79.8612], 13);
        }

        function addNearbyMarkersBase64(base64Data, markerClass) {
            try {
                if (!base64Data) return;
                var bytes = new Uint8Array(atob(base64Data).split("").map(c => c.charCodeAt(0)));
                var places = JSON.parse(new TextDecoder().decode(bytes));

                nearbyGroup.clearLayers();
                places.forEach(function(place) {
                    var icon = L.divIcon({ className: 'pulse-marker ' + markerClass, iconSize: [14, 14], iconAnchor: [7, 7] });
                    var marker = L.marker([place.lat, place.lng], { icon: icon });

                    var popupContent = '<div class="custom-popup">' +
                        '<div class="popup-title">' + (place.name || "Unnamed Place") + '</div>' +
                        '<div class="popup-addr">' + (place.address || "") + '</div>' +
                        '<div class="directions-link" onclick="navigateTo(' + place.lat + ',' + place.lng + ',\'' + (place.name || "").replace(/'/g, "\\'") + '\')">Get Directions</div>' +
                        '</div>';

                    marker.bindPopup(popupContent, { className: 'custom-popup' }).addTo(nearbyGroup);
                });

                var group = L.featureGroup(nearbyGroup.getLayers().concat(mainMarker ? [mainMarker] : []));
                if (group.getLayers().length > 0) map.flyToBounds(group.getBounds().pad(0.2), { animate: true, duration: 1.5 });
            } catch (e) { console.error(e); }
        }

        function navigateTo(lat, lng, name) {
            if (window.Android) window.Android.navigateTo(lat, lng, name);
        }
    </script>
</body>
</html>
